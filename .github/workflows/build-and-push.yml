name: Build and Push Model Image to ACR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code with LFS
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true
        persist-credentials: false

    - name: Download LFS objects
      run: git lfs pull

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Alibaba Cloud Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
        username: ${{ secrets.ALIYUN_ACR_USERNAME }}
        password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/qwen3.6-27b-aggressive-awq:latest
          ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/qwen3.6-27b-aggressive-awq:${{ github.sha }}
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max
